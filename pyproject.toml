[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-gateway"
version = "0.1.0"
description = "Taiwan-localized PII sanitization and AI safety gateway for K-12 generative AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "presidio-image-redactor>=0.0.56",
  "pydantic>=2.6",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
playground = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "google-genai>=1.40",
  "python-multipart>=0.0.9",
]

[project.scripts]
safety-gateway-demo = "safety_gateway.__main__:main"
safety-gateway-playground = "safety_gateway.playground.__main__:main"

[tool.setuptools.packages.find]
include = ["safety_gateway*"]

[tool.setuptools.package-data]
safety_gateway = ["py.typed", "playground/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
