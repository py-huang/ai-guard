[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-gateway"
version = "0.1.0"
description = "Taiwan-localized PII sanitization and AI safety gateway for K-12 generative AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "presidio-analyzer==2.2.364",
  "presidio-anonymizer==2.2.364",
  "presidio-image-redactor>=0.0.56",
  "pydantic>=2.6",
  "pillow>=10.0",
  "numpy>=1.26",
  "rapidocr-onnxruntime>=1.4.4",
  "spacy>=3.8,<3.9",
  "zh-core-web-md==3.8.0",
  "pypinyin>=0.51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
]
# Semantic content classifier (see README "大規模評測"). The gateway runs without it; it only needs
# onnxruntime (already pulled in by rapidocr) and tokenizers to load a model trained with the
# embedding head. Training additionally needs scikit-learn.
ml = [
  "tokenizers>=0.20",
]
train = [
  "safety-gateway[ml]",
  "scikit-learn>=1.5",
  "opencc-python-reimplemented>=0.1.7",
]
playground = [
  "safety-gateway[server]",
  "google-genai>=1.40",
]

[project.scripts]
safety-gateway-demo = "safety_gateway.__main__:main"
safety-gateway-server = "safety_gateway.server.__main__:main"
safety-gateway-playground = "safety_gateway.playground.__main__:main"
safety-gateway-share = "safety_gateway.playground.share:main"

[tool.setuptools.packages.find]
include = ["safety_gateway*"]

[tool.setuptools.package-data]
safety_gateway = ["py.typed", "playground/static/*", "playground/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
